
name: Build NEON JUMP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get game files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libffi-dev libssl-dev cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.36

      - name: Prepare game
        run: |
          cp newfile.py main.py

          mkdir -p p4a-recipes/pygame-ce

          cat > buildozer.spec <<'EOF'
          [app]
          title = NEON JUMP
          package.name = neonjump
          package.domain = org.ayush
          source.dir = .
          source.include_exts = py,txt
          version = 1.0
          requirements = python3,pygame-ce
          orientation = portrait
          fullscreen = 1
          android.api = 34
          android.minapi = 21
          android.ndk_api = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.local_recipes = ./p4a-recipes

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          cat > p4a-recipes/pygame-ce/__init__.py <<'EOF'
          from os.path import join
          from pythonforandroid.recipe import CompiledComponentsPythonRecipe
          from pythonforandroid.toolchain import current_directory

          class Pygame2Recipe(CompiledComponentsPythonRecipe):
              version = "2.5.0"
              url = "https://github.com/pygame-community/pygame-ce/archive/refs/tags/{version}.tar.gz"
              site_packages_name = "pygame-ce"
              name = "pygame-ce"
              depends = [
                  "sdl2", "sdl2_image", "sdl2_mixer",
                  "sdl2_ttf", "setuptools", "jpeg", "png"
              ]
              call_hostpython_via_targetpython = False
              install_in_hostpython = False

              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  with current_directory(self.get_build_dir(arch.arch)):
                      template = open("buildconfig/Setup.Android.SDL2.in").read()
                      env = self.get_recipe_env(arch)
                      env["ANDROID_ROOT"] = join(self.ctx.ndk.sysroot, "usr")

                      png = self.get_recipe("png", self.ctx)
                      png_lib = join(png.get_build_dir(arch.arch), ".libs")
                      png_inc = png.get_build_dir(arch)

                      jpeg = self.get_recipe("jpeg", self.ctx)
                      jpeg_inc = jpeg_lib = jpeg.get_build_dir(arch.arch)

                      mixer = self.get_recipe("sdl2_mixer", self.ctx)
                      mixer_inc = ""
                      for path in mixer.get_include_dirs(arch):
                          mixer_inc += f"-I{path} "

                      setup = template.format(
                          sdl_includes=(
                              " -I" + join(self.ctx.bootstrap.build_dir, "jni", "SDL", "include")
                              + " -L" + join(self.ctx.bootstrap.build_dir, "libs", str(arch))
                              + " -L" + png_lib
                              + " -L" + jpeg_lib
                              + " -L" + arch.ndk_lib_dir_versioned
                          ),
                          sdl_ttf_includes="-I" + join(self.ctx.bootstrap.build_dir, "jni", "SDL2_ttf"),
                          sdl_image_includes="-I" + join(self.ctx.bootstrap.build_dir, "jni", "SDL2_image", "include"),
                          sdl_mixer_includes=mixer_inc,
                          jpeg_includes="-I" + jpeg_inc,
                          png_includes="-I" + png_inc,
                          freetype_includes=""
                      )
                      open("Setup", "w").write(setup)

              def get_recipe_env(self, arch):
                  env = super().get_recipe_env(arch)
                  env["USE_SDL2"] = "1"
                  env["PYGAME_CROSS_COMPILE"] = "TRUE"
                  env["PYGAME_ANDROID"] = "TRUE"
                  return env

          recipe = Pygame2Recipe()
          EOF

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-JUMP-APK
          path: bin/*.apk
